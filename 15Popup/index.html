<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <button class="btn" onclick="openPopup()">Submit</button>
   

    <div class="popup">
        <img src="404-tick.png" alt="">
        <h1>Thank You!</h1>
        <p>Your details has been successfully submiting thanks!</p>
        <button class="on-btn" onclick="closePopup()">On </button>

    </div>
     </div>

    <script>
        let popup=document.querySelector('.popup');

        function openPopup()
        {
            
            popup.classList.add("open-popup");
        }

         function closePopup()
        {
             popup.classList.remove("open-popup");
            
        }

       

    </script>
</body>
</html>
