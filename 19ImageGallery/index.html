<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-wrap">
        <img src="images/back.png" alt="" id="backBtn" onclick="BackBtn()">
        <div class="container">

        <div class="gallery-cont" id="gallery">
             <!-- <span><img src="images/back.png" alt=""></span> -->
            <span><img src="images/image-1.png" alt=""></span>
             <span><img src="images/image-2.png" alt=""></span>
              <span><img src="images/image-3.png" alt=""></span>
            <span><img src="images/image-4.png" alt=""></span>
             <span><img src="images/image-5.png" alt=""></span>
              <span><img src="images/image-6.png" alt=""></span>
            
                <!-- <span><img src="images/next.png" alt=""></span> -->
        </div>
    </div>
         <img src="images/next.png" id="nextBtn" onclick="NextBtn()">
    </div>


    <script>
        const nextBtn= document.getElementById('nextBtn');
        const backBtn= document.getElementById('backBtn');
        const gallery= document.getElementById('gallery');


          function NextBtn()
          {
            
             gallery.scrollLeft+=270;
          }

           function BackBtn()
           {

            gallery.scrollLeft-=270;
            

           }

       
        
        
    </script>
    
    
</body>
</html>
